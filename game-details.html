<html class="dark" lang="en">
<head>

    <link rel="manifest" href="manifest.json" />

        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#ff751f',
                    },
                    fontFamily: {
                        poppins: ['Poppins', 'sans-serif'],
                        headline: ['Lexend', 'sans-serif'],

            }
        }

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;900&family=Lexend:wght@400;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
    <link rel="stylesheet" href="global.css" />
    <script type="module" src="route-guard.js"></script>

    <script>
        function applyTheme(isDark) {
            const themeIcon = document.getElementById('theme-toggle-icon');
            if (isDark) {
                document.documentElement.classList.add('dark');
                if(themeIcon) themeIcon.textContent = 'light_mode';
                localStorage.theme = 'dark';
            } else {
                document.documentElement.classList.remove('dark');
                if(themeIcon) themeIcon.textContent = 'dark_mode';
                localStorage.theme = 'light';
            }
        }
        // Check saved preference on load
        if (localStorage.theme === 'light') applyTheme(false);
        else applyTheme(true); // Default to dark mode
    </script>
    
    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        input[type="time"]::-webkit-calendar-picker-indicator { background: transparent; bottom: 0; color: transparent; cursor: pointer; height: auto; left: 0; position: absolute; right: 0; top: 0; width: auto; }
        input[type="date"]::-webkit-calendar-picker-indicator { background: transparent; bottom: 0; color: transparent; cursor: pointer; height: auto; left: 0; position: absolute; right: 0; top: 0; width: auto; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-[#0b0f15] text-gray-900 dark:text-gray-100 font-poppins antialiased min-h-screen pb-24 md:pb-0 selection:bg-[#ff751f]/30 overflow-x-hidden transition-colors duration-300 lg:pl-[320px]">

    <div id="global-sidebar-overlay" class="fixed inset-0 top-[72px] bg-black/70 backdrop-blur-sm z-[80] hidden opacity-0 transition-opacity duration-300 lg:hidden"></div>
    
    <header class="fixed top-0 left-0 w-full lg:w-[calc(100%-320px)] lg:left-[320px] h-[72px] z-[70] bg-white/90 dark:bg-[#0a0e14]/90 backdrop-blur-md border-b border-gray-200 dark:border-white/10 transition-colors duration-300">
        <div class="flex justify-between items-center px-4 md:px-8 h-full w-full">
            
            <div class="flex items-center gap-3 md:gap-4 h-full">
                <button id="menu-btn" aria-label="Open Menu" class="lg:hidden text-[#ff751f] active:scale-95 transition-transform duration-150 p-2 -ml-2 rounded-full hover:bg-[#ff751f]/10">
                    <span class="material-symbols-outlined">menu</span>
                </button>
                <div class="flex flex-col justify-center cursor-pointer" onclick="window.location.href='home.html'">
                    <span class="text-xl md:text-2xl font-black italic tracking-tighter text-[#ff751f] uppercase font-poppins leading-none">LIGA PH</span>
                    <span class="text-[7px] md:text-[9px] text-gray-500 dark:text-gray-400 tracking-[0.15em] md:tracking-[0.2em] uppercase font-mono mt-1 block leading-none">BUILD YOUR LEGACY</span>
                </div>
            </div>
            
            <div class="flex items-center justify-end gap-2 md:gap-4">
                <nav class="hidden md:flex gap-8 font-headline font-bold tracking-tight mr-2 lg:mr-6">
                    <a class="text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white transition-colors duration-200" href="home.html">Home</a>
                    <a class="text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white transition-colors duration-200" href="listings.html">Games</a>
                    <a class="text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white transition-colors duration-200" href="roster.html">Roster</a>
                </nav>
                
                <button id="theme-toggle-btn" aria-label="Toggle Light/Dark Mode" class="text-gray-600 dark:text-gray-300 hover:text-[#ff751f] dark:hover:text-[#ff751f] transition-colors p-2 rounded-full hover:bg-gray-100 dark:hover:bg-white/10 active:scale-95 flex items-center justify-center" onclick="applyTheme(!document.documentElement.classList.contains('dark'))">
                    <span id="theme-toggle-icon" class="material-symbols-outlined text-[24px]">dark_mode</span>
                </button>
            
                <a href="notifications.html" aria-label="Notifications" class="relative p-2 text-gray-600 dark:text-gray-300 hover:text-[#ff751f] dark:hover:text-[#ff751f] transition-colors rounded-full hover:bg-gray-100 dark:hover:bg-white/10 active:scale-95 z-50 flex items-center justify-center">
                    <span class="material-symbols-outlined text-[24px]">notifications</span>
                    <span id="nav-notif-badge" class="absolute top-2 right-2 w-2.5 h-2.5 bg-red-500 rounded-full border-2 border-white dark:border-[#0a0e14] hidden transition-colors duration-300"></span>
                </a>
            </div>
        </div>
    </header>

    <aside id="global-sidebar" class="fixed top-[72px] left-0 h-[calc(100vh-72px)] w-[320px] bg-white dark:bg-[#0a0e14] border-r border-gray-200 dark:border-white/10 z-[70] transform -translate-x-full lg:translate-x-0 transition-transform duration-300 flex flex-col shadow-2xl lg:shadow-none">
        
        <div class="px-5 pt-5 lg:pt-6 pb-5">
            <div id="sidebar-profile-card" class="flex flex-col items-center text-center bg-gray-50 dark:bg-[#14171d] border border-gray-200 dark:border-white/10 hover:border-[#ff751f] dark:hover:border-[#ff751f]/50 rounded-2xl p-5 transition-all duration-300 shadow-sm shrink-0 group w-full overflow-hidden box-border cursor-pointer" onclick="window.location.href='profile.html'">
                
                <div class="flex flex-col items-center w-full max-w-full overflow-hidden box-border animate-pulse">
                    <div class="relative mb-3 shrink-0">
                        <div class="w-16 h-16 md:w-20 md:h-20 rounded-full bg-gray-200 dark:bg-white/5 shadow-sm"></div>
                    </div>
                    <div class="h-4 w-3/4 bg-gray-200 dark:bg-white/5 rounded mb-2 mt-1"></div>
                    <div class="h-3 w-1/2 bg-gray-200 dark:bg-white/5 rounded mb-3"></div>
                    <div class="h-5 w-16 bg-gray-200 dark:bg-white/5 rounded-full mt-1"></div>
                </div>

            </div>
        </div>

        <div class="px-6"><div class="h-[1px] bg-gray-200 dark:bg-white/10 transition-colors duration-300"></div></div>

        <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto custom-scrollbar">
            <a href="admin.html" id="sidebar-admin-shortcut" class="hidden items-center gap-4 px-4 py-3.5 rounded-2xl bg-red-500/10 text-red-600 dark:text-red-400 hover:bg-red-500/20 border border-red-500/20 transition-colors duration-200 group shadow-sm mb-4">
                <span class="material-symbols-outlined group-hover:scale-110 transition-transform text-[20px]">admin_panel_settings</span>
                <span class="font-headline font-black text-xs tracking-widest uppercase">Admin Dashboard</span>
            </a>
            <a href="settings.html" class="flex items-center gap-4 px-4 py-3.5 rounded-2xl text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-white/5 transition-colors duration-200 group">
                <span class="material-symbols-outlined text-gray-400 dark:text-gray-500 group-hover:text-[#ff751f] transition-colors text-[22px]">settings</span>
                <span class="font-headline font-semibold text-sm tracking-wide">Settings and Privacy</span>
            </a>
            <a href="resource-center.html" class="flex items-center gap-4 px-4 py-3.5 rounded-2xl text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-white/5 transition-colors duration-200 group">
                <span class="material-symbols-outlined text-gray-400 dark:text-gray-500 group-hover:text-[#ff751f] transition-colors text-[22px]">help</span>
                <span class="font-headline font-semibold text-sm tracking-wide">Help and Support</span>
            </a>
        </nav>

        <div class="px-6"><div class="h-[1px] bg-gray-200 dark:bg-white/10 transition-colors duration-300"></div></div>

        <div class="p-6 mb-2 shrink-0">
            <button id="sidebar-logout-btn" aria-label="Logout" class="w-full flex items-center justify-center gap-3 px-4 py-4 rounded-xl text-red-600 dark:text-red-400 hover:bg-red-500/10 border border-transparent hover:border-red-500/20 transition-all duration-200 group active:scale-95">
                <span class="material-symbols-outlined text-xl group-hover:-translate-x-1 transition-transform">logout</span>
                <span class="font-headline font-bold text-sm uppercase tracking-widest">Logout</span>
            </button>
        </div>
    </aside>

    <div class="lg:pl-[320px] pt-[72px] w-full min-h-screen flex flex-col transition-all duration-300">
        <main id="game-details-main" class="py-6 px-4 md:px-6 max-w-7xl mx-auto w-full animate-pulse grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-8 space-y-6 mt-2 relative">
                <div class="w-full h-[400px] md:h-[500px] bg-white dark:bg-[#14171d] rounded-[32px] border border-gray-200 dark:border-white/10 shadow-sm transition-colors duration-300"></div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="h-48 bg-white dark:bg-[#14171d] rounded-[24px] border border-gray-200 dark:border-white/10 shadow-sm transition-colors duration-300"></div>
                    <div class="h-48 bg-white dark:bg-[#14171d] rounded-[24px] border border-gray-200 dark:border-white/10 shadow-sm transition-colors duration-300"></div>
                </div>
            </div>
            <div class="lg:col-span-4 mt-6 lg:mt-2 space-y-6">
                <div class="h-40 bg-white dark:bg-[#14171d] rounded-[24px] border border-gray-200 dark:border-white/10 shadow-sm transition-colors duration-300"></div>
                <div class="h-24 bg-white dark:bg-[#14171d] rounded-[24px] border border-gray-200 dark:border-white/10 shadow-sm transition-colors duration-300"></div>
            </div>
        </main>
    </div>

    <div id="manage-slot-modal" class="fixed inset-0 z-[100] bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white dark:bg-[#14171d] border border-gray-200 dark:border-white/10 rounded-3xl w-full max-w-sm overflow-hidden shadow-2xl scale-95 transition-transform duration-300">
            <div class="p-6 border-b border-gray-200 dark:border-white/10 flex justify-between items-center bg-gray-50 dark:bg-[#0a0e14]">
                <h2 id="manage-slot-title" class="font-headline text-xl font-black italic uppercase tracking-tighter text-gray-900 dark:text-white">Manage Slot</h2>
                <button id="close-slot-modal" class="text-gray-500 hover:text-gray-900 dark:hover:text-white transition-colors p-2 rounded-full hover:bg-gray-100 dark:hover:bg-white/5">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <div class="p-6 space-y-4">
                <button id="invite-connection-btn" class="w-full bg-gray-50 dark:bg-white/5 hover:border-[#ff751f]/50 text-gray-900 dark:text-white font-black uppercase tracking-widest py-4 rounded-xl transition-all text-sm flex items-center justify-center gap-2 border border-gray-200 dark:border-white/10 active:scale-95 shadow-sm">
                    <span class="material-symbols-outlined text-[#ff751f]">person_add</span> Invite Connection
                </button>
                <div class="relative flex items-center py-2">
                    <div class="flex-grow border-t border-gray-200 dark:border-white/10"></div>
                    <span class="flex-shrink-0 mx-4 text-gray-400 dark:text-gray-500 text-[10px] font-black uppercase tracking-widest">OR</span>
                    <div class="flex-grow border-t border-gray-200 dark:border-white/10"></div>
                </div>
                <button id="reserve-slot-btn" class="w-full bg-gray-900 dark:bg-[#0a0e14] hover:border-[#ff751f]/50 text-white dark:text-gray-400 border border-gray-700 dark:border-white/10 font-black uppercase tracking-widest py-4 rounded-xl transition-all text-sm flex items-center justify-center gap-2 active:scale-95 shadow-sm">
                    <span class="material-symbols-outlined">lock</span> Reserve Slot
                </button>
                <button id="remove-reserve-btn" class="hidden w-full bg-red-50 dark:bg-red-500/10 hover:bg-red-100 dark:hover:bg-red-500/20 text-red-600 dark:text-red-500 font-black uppercase tracking-widest py-4 rounded-xl transition-all text-sm flex items-center justify-center gap-2 border border-red-200 dark:border-red-500/20 active:scale-95 shadow-sm">
                    <span class="material-symbols-outlined">lock_open</span> Remove Reservation
                </button>
            </div>
        </div>
    </div>

    <div id="invite-list-modal" class="fixed inset-0 z-[110] bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white dark:bg-[#14171d] border border-gray-200 dark:border-white/10 rounded-3xl w-full max-w-md overflow-hidden shadow-2xl scale-95 transition-transform duration-300 flex flex-col max-h-[85vh]">
            <div class="p-6 border-b border-gray-200 dark:border-white/10 flex justify-between items-center bg-gray-50 dark:bg-[#0a0e14]">
                <h2 class="font-headline text-xl font-black italic uppercase tracking-tighter text-[#ff751f] flex items-center gap-2">
                    <span class="material-symbols-outlined">group_add</span> Invite Players
                </h2>
                <button id="close-invite-list-modal" class="text-gray-500 hover:text-gray-900 dark:hover:text-white transition-colors p-2 rounded-full hover:bg-gray-100 dark:hover:bg-white/5">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <div class="overflow-y-auto flex-1 p-4 hide-scrollbar space-y-3" id="invite-list-container"></div>
        </div>
    </div>

    <div id="manage-game-modal" class="fixed inset-0 z-[100] bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white dark:bg-[#14171d] border border-gray-200 dark:border-white/10 rounded-3xl w-full max-w-lg overflow-hidden shadow-2xl scale-95 transition-transform duration-300 flex flex-col max-h-[90vh]">
            <div class="p-6 border-b border-gray-200 dark:border-white/10 flex justify-between items-center shrink-0 bg-gray-50 dark:bg-[#0a0e14]">
                <h2 class="font-headline text-2xl font-black italic uppercase tracking-tighter text-[#ff751f]">Manage Game</h2>
                <button id="close-manage-game-modal" class="text-gray-500 hover:text-gray-900 dark:hover:text-white transition-colors p-2 rounded-full hover:bg-gray-100 dark:hover:bg-white/5">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <div class="overflow-y-auto flex-1 p-6 hide-scrollbar">
                <form id="manage-game-form" class="space-y-5">
                    <div>
                        <label class="block text-[10px] font-bold text-gray-500 dark:text-gray-400 uppercase tracking-widest mb-1.5">Game Title</label>
                        <input type="text" id="manage-game-title" required class="w-full bg-gray-50 dark:bg-[#0a0e14] border border-gray-200 dark:border-white/10 rounded-xl p-3 text-sm text-gray-900 dark:text-white focus:ring-[#ff751f] focus:border-[#ff751f] transition-all font-medium shadow-inner">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-[10px] font-bold text-gray-500 dark:text-gray-400 uppercase tracking-widest mb-1.5">Date</label>
                            <input type="date" id="manage-game-date" required class="w-full bg-gray-50 dark:bg-[#0a0e14] border border-gray-200 dark:border-white/10 rounded-xl p-3 text-sm text-gray-900 dark:text-white focus:ring-[#ff751f] focus:border-[#ff751f] transition-all font-medium [color-scheme:light] dark:[color-scheme:dark] shadow-inner">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-gray-500 dark:text-gray-400 uppercase tracking-widest mb-1.5">Time</label>
                            <input type="time" id="manage-game-time" required class="w-full bg-gray-50 dark:bg-[#0a0e14] border border-gray-200 dark:border-white/10 rounded-xl p-3 text-sm text-gray-900 dark:text-white focus:ring-[#ff751f] focus:border-[#ff751f] transition-all font-medium [color-scheme:light] dark:[color-scheme:dark] shadow-inner">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-500 dark:text-gray-400 uppercase tracking-widest mb-1.5">Location</label>
                        <input type="text" id="manage-game-location" required class="w-full bg-gray-50 dark:bg-[#0a0e14] border border-gray-200 dark:border-white/10 rounded-xl p-3 text-sm text-gray-900 dark:text-white focus:ring-[#ff751f] focus:border-[#ff751f] transition-all font-medium shadow-inner">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-500 dark:text-gray-400 uppercase tracking-widest mb-1.5">Description / Court Details</label>
                        <textarea id="manage-game-desc" rows="3" class="w-full bg-gray-50 dark:bg-[#0a0e14] border border-gray-200 dark:border-white/10 rounded-xl p-3 text-sm text-gray-900 dark:text-white focus:ring-[#ff751f] focus:border-[#ff751f] transition-all font-medium resize-none shadow-inner"></textarea>
                    </div>
                    
                    <div class="pt-6 mt-2 border-t border-gray-200 dark:border-white/10 space-y-3">
                        <button type="submit" id="submit-manage-game-btn" class="w-full bg-[#ff751f] hover:brightness-110 text-[#0a0e14] font-black uppercase tracking-widest py-4 rounded-xl shadow-lg active:scale-95 transition-all text-sm flex items-center justify-center gap-2">
                            <span class="material-symbols-outlined">save</span> Save Changes
                        </button>
                        <button type="button" onclick="window.deleteGame()" class="w-full bg-red-50 dark:bg-red-500/10 hover:bg-red-500 hover:text-white text-red-600 dark:text-red-500 font-black uppercase tracking-widest py-3 rounded-xl transition-all text-[10px] flex items-center justify-center gap-2 border border-red-200 dark:border-red-500/20 active:scale-95 shadow-sm">
                            <span class="material-symbols-outlined text-[14px]">delete_forever</span> Cancel / Delete Game
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="rating-modal" class="fixed inset-0 z-[100] bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white dark:bg-[#14171d] p-6 md:p-8 rounded-3xl w-full max-w-sm border border-gray-200 dark:border-white/10 shadow-2xl transform scale-95 transition-transform">
            <h3 class="font-headline font-black italic text-2xl text-[#ff751f] uppercase mb-1">Rate <span id="rating-target-name">Player</span></h3>
            <p class="text-xs text-gray-500 dark:text-gray-400 mb-6">Rate this player across 5 key attributes.</p>
            
            <form id="rating-form" class="space-y-5">
                <input type="hidden" id="rating-target-id" value="">
                <div id="rating-stars-container" class="space-y-4"></div>
                <div class="flex gap-4 pt-6 mt-6 border-t border-gray-200 dark:border-white/10">
                    <button type="button" id="close-rating-modal" class="flex-1 px-4 py-3 rounded-full text-xs font-bold uppercase tracking-widest text-gray-600 dark:text-gray-300 bg-gray-100 dark:bg-white/5 hover:bg-gray-200 dark:hover:bg-white/10 transition-colors">Cancel</button>
                    <button type="submit" id="submit-rating-btn" class="flex-1 px-4 py-3 rounded-full text-xs font-black uppercase tracking-widest text-[#0a0e14] bg-[#ff751f] hover:brightness-110 transition-all active:scale-95 shadow-lg shadow-[#ff751f]/20">Submit</button>
                </div>
            </form>
        </div>
    </div>

    <div id="image-modal" onclick="if(event.target === this) window.closeImageModal()" class="fixed inset-0 z-[120] bg-black/95 backdrop-blur-sm hidden items-center justify-center opacity-0 transition-opacity duration-300 cursor-pointer">
        <button id="close-image-modal" onclick="window.closeImageModal()" class="absolute top-6 right-6 text-white bg-black/50 hover:bg-black/80 rounded-full p-2 transition-colors cursor-pointer z-50">
            <span class="material-symbols-outlined text-3xl">close</span>
        </button>
        <img id="lightbox-image" src="" class="max-w-[95vw] max-h-[90vh] object-contain rounded-lg scale-95 transition-transform duration-300 shadow-2xl relative z-40 cursor-default" alt="Expanded View">
    </div>

    <nav id="action-bar-container" class="lg:hidden"></nav>

    <script type="module" src="sidebar.js"></script>
    <script type="module" src="action-bar.js"></script>
    <script type="module" src="firebase-setup.js"></script>
    <script type="module" src="game-details.js"></script>
</body>
</html>
