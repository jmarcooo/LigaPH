<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta name="view-transition" content="same-origin" />
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Liga PH - Notifications</title>
    
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0a0e14" />
    <link rel="apple-touch-icon" href="assets/logo-192.png">

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;700;800;900&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
    <script src="tailwind-theme.js"></script>
    <link rel="stylesheet" href="global.css" />
    <script type="module" src="route-guard.js"></script>
</head>
<body class="bg-background text-on-background min-h-screen pb-24 md:pb-0">

    <header class="fixed top-0 w-full z-40 bg-background/80 backdrop-blur-xl border-b border-outline-variant/10 transition-all">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            
            <div class="flex items-center gap-3">
                <button id="menu-btn" class="text-primary active:scale-95 transition-transform duration-150 p-2 -ml-2 rounded-full hover:bg-primary/10">
                    <span class="material-symbols-outlined">menu</span>
                </button>
                <a href="home.html" class="text-2xl font-black italic tracking-tighter text-primary uppercase font-headline hover:text-primary-container transition-colors">Liga PH</a>
            </div>

            <div class="flex items-center gap-4">
                <nav class="hidden md:flex gap-8 font-headline font-bold tracking-tight mr-4">
                    <a class="text-on-surface-variant hover:text-primary transition-colors duration-200" href="home.html">Home</a>
                    <a class="text-on-surface-variant hover:text-primary transition-colors duration-200" href="feeds.html">Feed</a>
                    <a class="text-on-surface-variant hover:text-primary transition-colors duration-200" href="listings.html">Games</a>
                    <a class="text-on-surface-variant hover:text-primary transition-colors duration-200" href="squads.html">Squads</a>
                </nav>
                
                <div class="flex items-center gap-1 md:gap-2">
                    <button id="header-search-btn" aria-label="Search" class="relative p-2 text-on-surface-variant hover:text-primary transition-colors rounded-full hover:bg-surface-container-highest active:scale-95 z-50">
                        <span class="material-symbols-outlined text-[28px]">search</span>
                    </button>
                    <a href="notifications.html" aria-label="Notifications" class="relative p-2 text-primary hover:text-primary transition-colors rounded-full hover:bg-surface-container-highest active:scale-95 z-50">
                        <span class="material-symbols-outlined text-[28px]">notifications</span>
                        <span class="absolute top-2 right-2 w-2.5 h-2.5 bg-error rounded-full border-2 border-[#0a0e14] hidden"></span>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <div id="global-sidebar-overlay" class="fixed inset-0 bg-[#0a0e14]/80 backdrop-blur-sm z-[60] hidden opacity-0 transition-opacity duration-300"></div>
    <aside id="global-sidebar" class="fixed top-0 left-0 h-full w-[85%] max-w-sm bg-[#0a0e14] border-r border-outline-variant/10 z-[70] transform -translate-x-full transition-transform duration-300 flex flex-col shadow-2xl">
        <div class="p-4 md:p-6 flex items-center justify-between border-b border-outline-variant/10">
            <img src="assets/logo.png" alt="Liga PH Logo" class="h-8 w-auto">
            <button id="close-sidebar-btn" class="text-on-surface-variant hover:text-error transition-colors p-2 rounded-full hover:bg-error/10 active:scale-95 -mr-2">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        
        <div class="flex-1 overflow-y-auto custom-scrollbar p-2 mt-4">
            <a href="index.html" class="block w-full text-center group pb-4 border-b border-outline-variant/10 mb-4 flex flex-col items-center">
               <div class="animate-pulse w-24 h-24 rounded-full bg-surface-container-highest mb-4"></div>
            </a>
            
            <nav class="flex flex-col"></nav>
        </div>
        
        <div class="p-4 border-t border-outline-variant/10 hidden">
            <button id="sidebar-logout-btn" class="flex items-center justify-center gap-3 w-full py-3.5 rounded-2xl bg-surface-container hover:bg-error/20 hover:border-error/30 border border-transparent text-error transition-colors font-headline font-black text-sm tracking-widest uppercase shadow-sm active:scale-95">
                <span class="material-symbols-outlined">logout</span>
                Log Out
            </button>
        </div>
    </aside>

    <main class="pt-24 px-4 max-w-3xl mx-auto min-h-screen flex flex-col">
        <div class="flex flex-col md:flex-row md:justify-between items-start md:items-center gap-3 md:gap-0 mb-6 border-b border-outline-variant/10 pb-4 mt-4">
            <div class="flex items-center gap-3">
                <button onclick="window.history.back()" class="text-on-surface-variant hover:text-primary transition-colors p-1 -ml-1 rounded-full active:scale-95">
                    <span class="material-symbols-outlined">arrow_back</span>
                </button>
                <h2 class="font-headline text-2xl font-black italic uppercase tracking-tighter text-on-surface">Notifications</h2>
            </div>
            <div class="flex gap-2 w-full md:w-auto justify-start md:justify-end">
                <button id="mark-all-read-btn" class="px-4 py-2 bg-primary/10 border border-primary/30 text-primary rounded-xl text-[10px] font-black uppercase tracking-widest hover:bg-primary hover:text-on-primary-container transition-colors shadow-sm hidden flex items-center gap-1.5 active:scale-95">
                    <span class="material-symbols-outlined text-[14px]">done_all</span> Read All
                </button>
                <button id="clear-all-btn" class="px-4 py-2 bg-error/10 border border-error/30 text-error rounded-xl text-[10px] font-black uppercase tracking-widest hover:bg-error hover:text-white transition-colors shadow-sm hidden flex items-center gap-1.5 active:scale-95">
                    <span class="material-symbols-outlined text-[14px]">delete_sweep</span> Clear All
                </button>
            </div>
        </div>

        <div id="notifications-container" class="space-y-3 flex-1 pb-10">
            <div class="animate-pulse space-y-3">
                <div class="flex items-center gap-4 p-4 rounded-2xl bg-surface-container-highest border border-outline-variant/10">
                    <div class="shrink-0 w-12 h-12 rounded-full bg-surface-container-high"></div>
                    <div class="flex-1 space-y-3 py-1">
                        <div class="h-4 bg-surface-container-high rounded w-3/4"></div>
                        <div class="h-3 bg-surface-container-high rounded w-1/2"></div>
                    </div>
                </div>
                <div class="flex items-center gap-4 p-4 rounded-2xl bg-surface-container-highest border border-outline-variant/10">
                    <div class="shrink-0 w-12 h-12 rounded-full bg-surface-container-high"></div>
                    <div class="flex-1 space-y-3 py-1">
                        <div class="h-4 bg-surface-container-high rounded w-5/6"></div>
                        <div class="h-3 bg-surface-container-high rounded w-1/3"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="action-bar-container"></div>

    <script type="module" src="sidebar.js"></script>
    <script type="module" src="action-bar.js"></script>
    <script type="module" src="firebase-setup.js"></script>
    <script type="module" src="notifications.js"></script>
</body>
</html>
