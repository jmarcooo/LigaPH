<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta name="view-transition" content="same-origin" />
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Liga PH - Notifications</title>
    
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0a0e14" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LigaPH">
    <link rel="apple-touch-icon" href="assets/logo-192.png">

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#ff751f',
                    },
                    fontFamily: {
                        poppins: ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@900&family=Lexend:wght@400;700;800;900&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
    <link rel="stylesheet" href="global.css" />
    <script type="module" src="route-guard.js"></script>
</head>
<body class="bg-gray-100 dark:bg-[#0b0f15] text-gray-900 dark:text-gray-100 min-h-screen pb-24 md:pb-0 selection:bg-[#ff751f]/30 overflow-x-hidden transition-colors duration-300">

    <div id="global-sidebar-overlay" class="fixed inset-0 top-[72px] bg-black/70 backdrop-blur-sm z-[60] hidden opacity-0 transition-opacity duration-300 lg:hidden"></div>
    
    <header class="fixed top-0 left-0 w-full h-[72px] z-[80] bg-white/90 dark:bg-[#0a0e14]/90 backdrop-blur-md border-b border-gray-200 dark:border-white/10 transition-colors duration-300">
        <div class="flex justify-between items-center px-4 md:px-8 h-full w-full">
            
            <div class="flex items-center gap-3 md:gap-4 h-full">
                <button id="menu-btn" aria-label="Open Menu" class="lg:hidden text-[#ff751f] active:scale-95 transition-transform duration-150 p-2 -ml-2 rounded-full hover:bg-[#ff751f]/10">
                    <span class="material-symbols-outlined">menu</span>
                </button>
                <div class="flex flex-col justify-center cursor-pointer" onclick="window.location.href='home.html'">
                    <span class="text-xl md:text-2xl font-black italic tracking-tighter text-[#ff751f] uppercase font-poppins hover:brightness-110 transition-colors leading-none">Liga PH</span>
                    <span class="text-[7px] md:text-[9px] text-gray-500 dark:text-gray-400 tracking-[0.15em] md:tracking-[0.2em] uppercase font-mono mt-1 block leading-none">BUILD YOUR LEGACY</span>
                </div>
            </div>
            
            <div class="flex items-center justify-end gap-2 md:gap-4">
                <nav class="hidden md:flex gap-6 lg:gap-8 font-headline font-bold tracking-tight mr-2 lg:mr-6">
                    <a class="text-gray-500 dark:text-gray-400 hover:text-[#ff751f] transition-colors duration-200" href="home.html">Home</a>
                    <a class="text-gray-500 dark:text-gray-400 hover:text-[#ff751f] transition-colors duration-200" href="listings.html">Games</a>
                    <a class="text-gray-500 dark:text-gray-400 hover:text-[#ff751f] transition-colors duration-200" href="roster.html">Roster</a>
                </nav>
                
                <button id="theme-toggle-btn" aria-label="Toggle Light/Dark Mode" class="text-gray-600 dark:text-gray-300 hover:text-[#ff751f] dark:hover:text-[#ff751f] transition-colors p-2 rounded-full hover:bg-gray-100 dark:hover:bg-white/10 active:scale-95 flex items-center justify-center">
                    <span id="theme-toggle-icon" class="material-symbols-outlined text-[24px]">light_mode</span>
                </button>

                <button id="header-search-btn" aria-label="Search" class="text-gray-600 dark:text-gray-300 hover:text-[#ff751f] dark:hover:text-[#ff751f] transition-colors p-2 rounded-full hover:bg-gray-100 dark:hover:bg-white/10 active:scale-95 flex items-center justify-center">
                    <span class="material-symbols-outlined text-[24px]">search</span>
                </button>
            
                <a href="notifications.html" aria-label="Notifications" class="relative p-2 text-[#ff751f] dark:text-[#ff751f] transition-colors rounded-full hover:bg-gray-100 dark:hover:bg-white/10 active:scale-95 z-50 flex items-center justify-center">
                    <span class="material-symbols-outlined text-[24px]">notifications</span>
                    <span id="nav-notif-badge" class="absolute top-2 right-2 w-2.5 h-2.5 bg-red-500 rounded-full border-2 border-white dark:border-[#0a0e14] hidden transition-colors duration-300"></span>
                </a>
            </div>
        </div>
    </header>

    <aside id="global-sidebar" class="fixed top-[72px] left-0 h-[calc(100vh-72px)] w-[320px] bg-white dark:bg-[#0a0e14] border-r border-gray-200 dark:border-white/10 z-[70] transform -translate-x-full lg:translate-x-0 transition-transform duration-300 flex flex-col shadow-2xl lg:shadow-none">
        
        <div class="px-5 pt-5 lg:pt-6 pb-5">
            <div id="sidebar-profile-card" class="flex flex-col items-center text-center bg-gray-50 dark:bg-[#14171d] border border-gray-200 dark:border-white/10 hover:border-[#ff751f] dark:hover:border-[#ff751f]/50 rounded-2xl p-5 transition-all duration-300 shadow-sm shrink-0 group w-full overflow-hidden box-border">
                <div class="flex flex-col items-center w-full max-w-full overflow-hidden box-border animate-pulse">
                    <div class="relative mb-3 shrink-0">
                        <div class="w-16 h-16 md:w-20 md:h-20 rounded-full bg-gray-200 dark:bg-white/5 shadow-sm"></div>
                    </div>
                    <div class="h-4 w-3/4 bg-gray-200 dark:bg-white/5 rounded mb-2 mt-1"></div>
                    <div class="h-3 w-1/2 bg-gray-200 dark:bg-white/5 rounded mb-3"></div>
                    <div class="h-5 w-16 bg-gray-200 dark:bg-white/5 rounded-full mt-1"></div>
                </div>
            </div>
        </div>

        <div class="px-6"><div class="h-[1px] bg-gray-200 dark:bg-white/10 transition-colors duration-300"></div></div>

        <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto custom-scrollbar">
            <a href="admin.html" id="sidebar-admin-shortcut" class="hidden items-center gap-4 px-4 py-3.5 rounded-2xl bg-red-500/10 text-red-600 dark:text-red-400 hover:bg-red-500/20 border border-red-500/20 transition-colors duration-200 group shadow-sm mb-4">
                <span class="material-symbols-outlined group-hover:scale-110 transition-transform text-[20px]">admin_panel_settings</span>
                <span class="font-headline font-black text-xs tracking-widest uppercase">Admin Dashboard</span>
            </a>
            <a href="settings.html" class="flex items-center gap-4 px-4 py-3.5 rounded-2xl text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-white/5 transition-colors duration-200 group">
                <span class="material-symbols-outlined text-gray-400 dark:text-gray-500 group-hover:text-[#ff751f] transition-colors text-[22px]">settings</span>
                <span class="font-headline font-semibold text-sm tracking-wide">Settings and Privacy</span>
            </a>
            <a href="resource-center.html" class="flex items-center gap-4 px-4 py-3.5 rounded-2xl text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-white/5 transition-colors duration-200 group">
                <span class="material-symbols-outlined text-gray-400 dark:text-gray-500 group-hover:text-[#ff751f] transition-colors text-[22px]">help</span>
                <span class="font-headline font-semibold text-sm tracking-wide">Help and Support</span>
            </a>
        </nav>

        <div class="px-6"><div class="h-[1px] bg-gray-200 dark:bg-white/10 transition-colors duration-300"></div></div>

        <div class="p-6 mb-2 shrink-0">
            <button id="sidebar-logout-btn" aria-label="Logout" class="w-full flex items-center justify-center gap-3 px-4 py-4 rounded-xl text-red-600 dark:text-red-400 hover:bg-red-500/10 border border-transparent hover:border-red-500/20 transition-all duration-200 group active:scale-95">
                <span class="material-symbols-outlined text-xl group-hover:-translate-x-1 transition-transform">logout</span>
                <span class="font-headline font-bold text-sm uppercase tracking-widest">Logout</span>
            </button>
        </div>
    </aside>

    <div class="lg:pl-[320px] pt-[72px] w-full min-h-screen flex flex-col transition-all duration-300">
        <main class="py-6 px-4 md:px-6 max-w-3xl mx-auto w-full flex-1 min-w-0">
            
            <div class="flex flex-col md:flex-row md:justify-between items-start md:items-center gap-3 md:gap-0 mb-6 border-b border-gray-200 dark:border-white/10 pb-4">
                <div class="flex items-center gap-3">
                    <button onclick="window.history.back()" class="text-gray-500 dark:text-gray-400 hover:text-[#ff751f] dark:hover:text-[#ff751f] transition-colors p-1 -ml-1 rounded-full active:scale-95 hidden md:block">
                        <span class="material-symbols-outlined">arrow_back</span>
                    </button>
                    <h1 class="font-headline text-2xl md:text-3xl font-black italic uppercase tracking-tighter text-gray-900 dark:text-white transition-colors duration-300">Notifications</h1>
                </div>
                <div class="flex gap-2 w-full md:w-auto justify-start md:justify-end">
                    <button id="mark-all-read-btn" class="px-4 py-2 bg-[#ff751f]/10 border border-[#ff751f]/30 text-[#ff751f] rounded-xl text-[10px] font-black uppercase tracking-widest hover:bg-[#ff751f] hover:text-[#0a0e14] transition-colors shadow-sm hidden flex items-center gap-1.5 active:scale-95">
                        <span class="material-symbols-outlined text-[14px]">done_all</span> Read All
                    </button>
                    <button id="clear-all-btn" class="px-4 py-2 bg-red-500/10 border border-red-500/30 text-red-500 rounded-xl text-[10px] font-black uppercase tracking-widest hover:bg-red-500 hover:text-white transition-colors shadow-sm hidden flex items-center gap-1.5 active:scale-95">
                        <span class="material-symbols-outlined text-[14px]">delete_sweep</span> Clear All
                    </button>
                </div>
            </div>

            <div id="notifications-container" class="space-y-3 flex-1 pb-10">
                <div class="animate-pulse space-y-3">
                    <div class="flex items-center gap-4 p-4 rounded-2xl bg-white dark:bg-[#14171d] border border-gray-200 dark:border-white/10 transition-colors duration-300">
                        <div class="shrink-0 w-12 h-12 rounded-full bg-gray-200 dark:bg-white/5"></div>
                        <div class="flex-1 space-y-3 py-1">
                            <div class="h-4 bg-gray-200 dark:bg-white/5 rounded w-3/4"></div>
                            <div class="h-3 bg-gray-200 dark:bg-white/5 rounded w-1/2"></div>
                        </div>
                    </div>
                    <div class="flex items-center gap-4 p-4 rounded-2xl bg-white dark:bg-[#14171d] border border-gray-200 dark:border-white/10 transition-colors duration-300">
                        <div class="shrink-0 w-12 h-12 rounded-full bg-gray-200 dark:bg-white/5"></div>
                        <div class="flex-1 space-y-3 py-1">
                            <div class="h-4 bg-gray-200 dark:bg-white/5 rounded w-5/6"></div>
                            <div class="h-3 bg-gray-200 dark:bg-white/5 rounded w-1/3"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <nav id="action-bar-container" class="lg:hidden"></nav>

    <script type="module" src="sidebar.js"></script>
    <script type="module" src="action-bar.js"></script>
    <script type="module" src="firebase-setup.js"></script>
    <script type="module" src="notifications.js"></script>
</body>
</html>
